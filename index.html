<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bret's Dashboard">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Bret's Dashboard</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#243044;--accent:#3b82f6;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--green:#22c55e;--yellow:#f59e0b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 16px 32px;}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.greeting{font-size:22px;font-weight:700;}
.datetime{font-size:13px;color:var(--muted);margin-top:2px;}
.refresh-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border);}
.card.full{grid-column:1/-1;}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px;}
.weather-main{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.weather-icon{font-size:36px;}
.weather-temp{font-size:36px;font-weight:700;}
.weather-desc{font-size:13px;color:var(--muted);}
.weather-details{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--muted);}
.links-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.link-btn{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 4px;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px;}
.link-btn .icon{font-size:22px;}
.link-btn .label{font-size:10px;color:var(--muted);}
.task-input-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.task-input{flex:1;min-width:120px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--text);font-size:13px;outline:none;}
.task-input::placeholder{color:var(--muted);}
.add-btn{background:var(--accent);border:none;border-radius:8px;color:white;padding:7px 12px;font-size:16px;cursor:pointer;}
.task-list{max-height:180px;overflow-y:auto;}
.task-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;}
.task-item:last-child{border-bottom:none;}
.task-check{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;}
.task-check.done{background:var(--green);border-color:var(--green);}
.task-text{flex:1;}
.task-text.done{text-decoration:line-through;color:var(--muted);}
.task-del{color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;}
.task-time{font-size:11px;color:var(--accent);margin-left:4px;white-space:nowrap;}
.no-tasks{color:var(--muted);font-size:13px;text-align:center;padding:16px 0;}
.time-picker{background:var(--card2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;padding:3px 6px;}
.notif-bar{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
.notif-bar button{background:var(--accent);border:none;border-radius:6px;color:white;padding:4px 10px;font-size:11px;cursor:pointer;}
.news-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.news-tab{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);}
.news-tab.active{background:var(--accent);color:white;border-color:var(--accent);}
.news-item{padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.news-item:last-child{border-bottom:none;}
.news-title{font-size:13px;font-weight:500;line-height:1.4;}
.news-date{font-size:11px;color:var(--muted);margin-top:2px;}
.msg{color:var(--muted);font-size:13px;padding:12px 0;}
.cal-event{padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.cal-event:last-child{border-bottom:none;}
.cal-time{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px;}
.cal-title{font-weight:500;line-height:1.4;}
.cal-btn{background:var(--accent);border:none;border-radius:8px;color:white;padding:8px 14px;font-size:13px;cursor:pointer;width:100%;margin-top:4px;}
.cal-btn.secondary{background:transparent;border:1px solid var(--border);color:var(--muted);margin-top:6px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="greeting" id="greeting">Hey Bret 👋</div>
    <div class="datetime" id="datetime"></div>
  </div>
  <button class="refresh-btn" onclick="loadAll()">↻</button>
</div>
<div class="grid">
  <div class="card">
    <div class="card-title">☀️ Weather · Tampa</div>
    <div id="weather-content"><div class="msg"><span class="spinner"></span>Loading…</div></div>
  </div>
  <div class="card">
    <div class="card-title">⚡ Quick Links</div>
    <div class="links-grid">
      <a class="link-btn" href="https://calendar.google.com" target="_blank"><span class="icon">📅</span><span class="label">Calendar</span></a>
      <a class="link-btn" href="https://mail.google.com" target="_blank"><span class="icon">📧</span><span class="label">Gmail</span></a>
      <a class="link-btn" href="https://zapier.com" target="_blank"><span class="icon">⚡</span><span class="label">Zapier</span></a>
      <a class="link-btn" href="https://claude.ai" target="_blank"><span class="icon">🤖</span><span class="label">Claude</span></a>
      <a class="link-btn" href="https://healthyfeet.ema.md/ema/web/practice/staff/#/practice/staff/dashboard" target="_blank"><span class="icon">🏥</span><span class="label">Schedule</span></a>
    </div>
  </div>
  <div class="card full">
    <div class="card-title">📅 Calendar — Next 7 Days</div>
    <div id="cal-content"><div class="msg"><span class="spinner"></span>Loading…</div></div>
  </div>
  <div class="card full">
    <div class="card-title">✅ Tasks</div>
    <div id="notif-bar"></div>
    <div class="task-input-row">
      <input class="task-input" id="task-input" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTask()">
      <input type="datetime-local" class="time-picker" id="task-time" title="Set reminder date & time">
      <button class="add-btn" onclick="addTask()">+</button>
    </div>
    <div class="task-list" id="task-list"></div>
  </div>
 
  <div class="card full">
    <div class="card-title">📰 News</div>
    <div class="news-tabs">
      <button class="news-tab active" onclick="switchTab('eagles',this)">🦅 Eagles</button>
      <button class="news-tab" onclick="switchTab('lightning',this)">⚡ Lightning</button>
      <button class="news-tab" onclick="switchTab('manutd',this)">🔴 Man Utd</button>
    </div>
    <div id="news-content"><div class="msg"><span class="spinner"></span>Loading…</div></div>
  </div>
</div>
<script>
function updateClock(){
  const n=new Date(),h=n.getHours();
  const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  document.getElementById('greeting').textContent=g+', Bret 👋';
  document.getElementById('datetime').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+' · '+n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
updateClock();setInterval(updateClock,30000);

async function tFetch(url,ms=7000,headers={}){
  const c=new AbortController();
  const id=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal,headers});clearTimeout(id);return r;}
  catch(e){clearTimeout(id);throw e;}
}

async function loadWeather(){
  const el=document.getElementById('weather-content');
  try{
    const r=await tFetch('https://api.open-meteo.com/v1/forecast?latitude=27.9506&longitude=-82.4572&current=temperature_2m,weathercode,windspeed_10m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FNew_York&forecast_days=1');
    const d=await r.json();
    const t=Math.round(d.current.temperature_2m),code=d.current.weathercode;
    const hi=Math.round(d.daily.temperature_2m_max[0]),lo=Math.round(d.daily.temperature_2m_min[0]);
    const w=Math.round(d.current.windspeed_10m),hu=d.current.relative_humidity_2m;
    el.innerHTML=`<a href="https://weather.com/weather/tenday/l/Tampa+FL+USFL0481:1:US" target="_blank" style="text-decoration:none;color:inherit;display:block;"><div class="weather-main"><span class="weather-icon">${wIcon(code)}</span><div><div class="weather-temp">${t}°</div><div class="weather-desc">${wDesc(code)}</div></div></div><div class="weather-details"><span>↑${hi}° ↓${lo}°</span><span>💨 ${w}mph</span><span>💧 ${hu}%</span><span style="color:var(--accent);margin-left:auto;">10-day →</span></div></a>`;
  }catch(e){el.innerHTML='<div class="msg">Tap ↻ to load weather</div>';}
}
function wIcon(c){if(c===0)return'☀️';if(c<=2)return'⛅';if(c<=3)return'☁️';if(c<=48)return'🌫️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=99)return'⛈️';return'🌡️';}
function wDesc(c){if(c===0)return'Clear sky';if(c<=2)return'Partly cloudy';if(c<=3)return'Overcast';if(c<=48)return'Foggy';if(c<=67)return'Rainy';if(c<=77)return'Snowy';if(c<=99)return'Thunderstorm';return'Unknown';}

// Notifications
let notifGranted=localStorage.getItem('notif_granted')==='true';
function initNotif(){
  const bar=document.getElementById('notif-bar');
  if(!('Notification' in window)){bar.innerHTML='';return;}
  if(Notification.permission==='granted'){notifGranted=true;localStorage.setItem('notif_granted','true');bar.innerHTML='';return;}
  if(Notification.permission==='denied'){bar.innerHTML='<div class="notif-bar">Notifications blocked — enable in Safari Settings</div>';return;}
  bar.innerHTML='<div class="notif-bar"><span>Enable alerts for task reminders</span><button onclick="requestNotif()">Allow</button></div>';
}
function requestNotif(){
  Notification.requestPermission().then(p=>{
    if(p==='granted'){notifGranted=true;localStorage.setItem('notif_granted','true');document.getElementById('notif-bar').innerHTML='';}
    else{document.getElementById('notif-bar').innerHTML='<div class="notif-bar">Notifications blocked — enable in Safari Settings</div>';}
  });
}
function scheduleNotif(text,datetimeStr){
  if(!notifGranted||!datetimeStr)return;
  const fire=new Date(datetimeStr);
  const delay=fire-Date.now();
  if(delay<=0)return;
  setTimeout(()=>{
    if(Notification.permission==='granted')new Notification('Task Reminder',{body:text,icon:'https://fav.farm/✅'});
  },delay);
}
function fmtDT(s){const d=new Date(s);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});}

// Tasks
let tasks=JSON.parse(localStorage.getItem('bret_tasks')||'[]');
function saveTasks(){localStorage.setItem('bret_tasks',JSON.stringify(tasks));}
function renderTasks(){
  const l=document.getElementById('task-list');
  if(!tasks.length){l.innerHTML='<div class="no-tasks">No tasks — you\'re all caught up 🎉</div>';return;}
  l.innerHTML=tasks.map((t,i)=>`<div class="task-item"><div class="task-check ${t.done?'done':''}" onclick="toggleTask(${i})">${t.done?'✓':''}</div><span class="task-text ${t.done?'done':''}">${t.text}</span>${t.time?`<span class="task-time">⏰ ${fmtDT(t.time)}</span>`:''}<span class="task-del" onclick="deleteTask(${i})">×</span></div>`).join('');
}
function addTask(){
  const i=document.getElementById('task-input'),t=i.value.trim();
  const timeEl=document.getElementById('task-time'),time=timeEl.value;
  if(!t)return;
  tasks.unshift({text:t,done:false,time:time||null});
  if(time)scheduleNotif(t,time);
  saveTasks();renderTasks();
  i.value='';timeEl.value='';
}
function toggleTask(i){tasks[i].done=!tasks[i].done;saveTasks();renderTasks();}
function deleteTask(i){tasks.splice(i,1);saveTasks();renderTasks();}
initNotif();
renderTasks();

// News
const cache={};let activeTab='eagles';
const FEED={
  eagles:'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.philadelphiaeagles.com%2Frss%2Fnews',
  lightning:'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fnews.google.com%2Frss%2Fsearch%3Fq%3DTampa%2BBay%2BLightning%26hl%3Den-US%26gl%3DUS%26ceid%3DUS%3Aen',
  manutd:'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fnews.google.com%2Frss%2Fsearch%3Fq%3DManchester%2BUnited%2Bfootball%26hl%3Den-US%26gl%3DUS%26ceid%3DUS%3Aen'
};
async function loadNews(team){
  if(cache[team])return cache[team];
  try{
    const r=await tFetch(FEED[team]);
    const d=await r.json();
    if(d.items&&d.items.length){
      cache[team]=d.items.slice(0,7).map(i=>({title:i.title,url:i.link||i.url,date:i.pubDate?new Date(i.pubDate).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}));
      return cache[team];
    }
  }catch(e){}
  return null;
}
async function switchTab(team,btn){
  document.querySelectorAll('.news-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');activeTab=team;renderNews(team);
}
async function renderNews(team){
  const el=document.getElementById('news-content');
  el.innerHTML='<div class="msg"><span class="spinner"></span>Loading…</div>';
  const items=await loadNews(team);
  if(!items){el.innerHTML='<div class="msg">Could not load — tap ↻ to retry</div>';return;}
  el.innerHTML=items.map(i=>`<div class="news-item" onclick="window.open('${i.url}','_blank')"><div class="news-title">${i.title}</div>${i.date?`<div class="news-date">${i.date}</div>`:''}</div>`).join('');
}
function loadAll(){

  loadWeather();
  cache.eagles=null;cache.lightning=null;cache.manutd=null;
  renderNews(activeTab);
  if(tokenClient)fetchCalEvents();
}

// Calendar
const CAL_CLIENT_ID='7876753626-poa6fhjh6h9e08vrhe8lveoe455fthbv.apps.googleusercontent.com';
const CAL_SCOPE='https://www.googleapis.com/auth/calendar.readonly';
let calToken=localStorage.getItem('cal_token');
let calExpiry=parseInt(localStorage.getItem('cal_expiry')||'0');
let tokenClient;
function calInit(){
  if(typeof google==='undefined'){setTimeout(calInit,500);return;}
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:CAL_CLIENT_ID,
    scope:CAL_SCOPE,
    callback:(resp)=>{
      if(resp.error){showCalError('Auth failed: '+resp.error);return;}
      calToken=resp.access_token;
      calExpiry=Date.now()+(resp.expires_in*1000);
      localStorage.setItem('cal_token',calToken);
      localStorage.setItem('cal_expiry',String(calExpiry));
      fetchCalEvents();
    }
  });
  if(calToken&&Date.now()<calExpiry){fetchCalEvents();}
  else{tokenClient.requestAccessToken({prompt:calToken?'none':''});}
}
function showCalConnect(){
  document.getElementById('cal-content').innerHTML='<button class="cal-btn" onclick="calSignIn()">Connect Google Calendar</button>';
}
function showCalError(msg){
  document.getElementById('cal-content').innerHTML=`<div class="msg">${msg}</div><button class="cal-btn secondary" onclick="calSignIn()">Retry</button>`;
}
function calSignIn(){tokenClient.requestAccessToken({prompt:''});}
async function fetchCalEvents(){
  const el=document.getElementById('cal-content');
  el.innerHTML='<div class="msg"><span class="spinner"></span>Loading…</div>';
  try{
    const now=new Date().toISOString();
    const end=new Date(Date.now()+7*24*60*60*1000).toISOString();
    const r=await tFetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${now}&timeMax=${end}&singleEvents=true&orderBy=startTime&maxResults=10`,8000,{'Authorization':'Bearer '+calToken});
    const d=await r.json();
    if(d.error){showCalConnect();return;}
    if(!d.items||d.items.length===0){el.innerHTML='<div class="msg">No upcoming events 🎉</div>';return;}
    el.innerHTML=d.items.map(ev=>{
      const start=ev.start.dateTime||ev.start.date;
      const dt=new Date(start);
      const timeStr=ev.start.dateTime
        ?dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+' · '+dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})
        :dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
      return `<div class="cal-event"><div class="cal-time">${timeStr}</div><div class="cal-title">${ev.summary||'(No title)'}</div></div>`;
    }).join('');
  }catch(e){showCalError('Could not load — tap Retry');}
}
window.addEventListener('load',calInit);
loadWeather();
renderNews('eagles');
</script>
</body>
</html>
